<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Visuals | Pedidos</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin.css">
    <script src="/admin-auth-init.js"></script>
</head>
<body>

    <main class="main">

        <header class="page-header">
            <div>
                <p class="page-eyebrow">Catálogo</p>
                <h2 class="page-title">PEDIDOS</h2>
            </div>
            <div class="vz-flex-actions">
                <button type="button" class="btn-logout" id="btnLogout" aria-label="Sair">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    <span class="label">Sair</span>
</button>
                <div class="produto-count" id="pedidosCount">—</div>
                <div class="produto-count-label">abertos</div>
            </div>
        </header>

        <!-- [VZ] Fase 7 — configuração de frete por região (UF). Nativo
             <details>/<summary>, sem JS pra abrir/fechar. -->
        <details class="frete-config-panel" id="freteConfigPanel">
            <summary>Configurar frete por região (UF)</summary>
            <p class="frete-config-hint">Defina um valor e prazo por estado. O catálogo público calcula sozinho a partir do CEP do cliente. Estado sem valor aqui continua sendo combinado manualmente pelo WhatsApp.</p>
            <div class="frete-config-form">
                <select id="freteUf" aria-label="Estado">
                    <option value="">UF...</option>
                    <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                    <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                    <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                    <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                    <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                    <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                    <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                    <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                    <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                </select>
                <input type="number" id="freteValor" placeholder="Valor (R$)" min="0" max="9999" step="0.01">
                <input type="number" id="fretePrazo" placeholder="Prazo (dias)" min="1" max="90" step="1">
                <button type="button" class="btn-launch" id="btnSalvarFrete">Salvar</button>
            </div>
            <div class="frete-config-lista" id="freteConfigLista"></div>
        </details>

        <!-- Filter + actions bar -->
        <div class="pedidos-controls">
            <div class="pedidos-filter-chips" role="group" aria-label="Filtrar por status">
                <button class="status-filter-chip active" data-status="" type="button">Todos</button>
                <button class="status-filter-chip" data-status="novo"       type="button">Novo</button>
                <button class="status-filter-chip" data-status="confirmado" type="button">Confirmado</button>
                <button class="status-filter-chip" data-status="producao"   type="button">Em Produção</button>
                <button class="status-filter-chip" data-status="enviado"    type="button">Enviado</button>
                <button class="status-filter-chip" data-status="entregue"   type="button">Entregue</button>
            </div>
            <button type="button" class="btn-launch" id="btnNovoPedido">+ Novo Pedido</button>
            <button type="button" class="btn-secondary" id="btnExportCsv">Exportar CSV</button>
        </div>

        <!-- Order list -->
        <div id="pedidosList" class="pedidos-list">
            <div class="vz-empty-state">Carregando pedidos...</div>
        </div>

    </main>

    <!-- NEW PEDIDO FORM MODAL -->
    <div class="pedido-form-modal" id="pedidoFormModal" role="dialog" aria-modal="true" aria-labelledby="formTitle" aria-hidden="true">
        <div class="pedido-form-backdrop" id="formBackdrop"></div>
        <div class="pedido-form-card" role="document">
            <button type="button" class="pedido-form-close" id="btnFecharForm" aria-label="Fechar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <h3 id="formTitle" class="pedido-form-title">Novo pedido</h3>
            <form id="pedidoForm" novalidate>
                <div class="pedido-form-grid">
                    <div class="field-group">
                        <label class="field-label" for="fProduto">Produto *</label>
                        <input type="text" id="fProduto" placeholder="CAMISETA NIRVANA PRETA" required maxlength="200">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="fTamanho">Tamanho</label>
                        <select id="fTamanho">
                            <option value="">—</option>
                            <option value="P">P</option>
                            <option value="M">M</option>
                            <option value="G">G</option>
                            <option value="GG">GG</option>
                            <option value="XG">XG</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="fCliente">Cliente</label>
                        <input type="text" id="fCliente" placeholder="Nome do cliente" maxlength="100">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="fWhatsapp">WhatsApp</label>
                        <input type="tel" id="fWhatsapp" placeholder="+55 11 9 9999-9999" maxlength="30">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="fValor">Valor (R$)</label>
                        <input type="number" id="fValor" step="0.01" min="0" max="9999">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="fCep">CEP do cliente</label>
                        <input type="text" id="fCep" placeholder="01001-000" maxlength="9" inputmode="numeric">
                        <p class="cep-info" id="cepInfo"></p>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="fStatus">Status</label>
                        <select id="fStatus">
                            <option value="novo">Novo</option>
                            <option value="confirmado">Confirmado</option>
                            <option value="producao">Em Produção</option>
                            <option value="enviado">Enviado</option>
                            <option value="entregue">Entregue</option>
                        </select>
                    </div>
                </div>
                <div class="field-group">
                    <label class="field-label" for="fNotas">Observações</label>
                    <textarea id="fNotas" rows="2" placeholder="CEP, referência, etc..." maxlength="1000"></textarea>
                </div>

                <!-- [VZ] Fase 8 — só aparece editando um pedido já existente
                     (precisa de um ID pra anexar o comprovante a). -->
                <div class="field-group comprovante-field" id="comprovanteField" hidden>
                    <label class="field-label" for="fComprovante">Comprovante de pagamento (PIX recebido na chave pessoal)</label>
                    <input type="file" id="fComprovante" accept="image/jpeg,image/png,image/webp">
                    <button type="button" class="btn-secondary" id="btnAnalisarComprovante">Analisar comprovante</button>
                    <p class="comprovante-resultado" id="comprovanteResultado" aria-live="polite"></p>
                    <button type="button" class="btn-launch comprovante-confirmar" id="btnConfirmarPagamento" hidden>Confirmar pagamento recebido</button>
                </div>

                <div class="pedido-form-actions">
                    <button type="button" class="btn-secondary" id="btnCancelarForm">Cancelar</button>
                    <button type="submit" class="btn-launch">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    
    <script src="/admin-pedidos.js"></script>
    <script src="/admin-shared.js"></script>
</body>
</html>
